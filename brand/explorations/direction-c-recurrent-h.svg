<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%" fill="none">
  <!-- Direction C (Optically Calibrated): The Recurrent H — Graph Vertices with Optical Centering & Recurrence Arc -->
  <!-- Wide-Clearance Recurrence Feedback Arc: Output (31, 24.5) -> Input (11, 11.5) -->
  <path
    d="M 31,24.5 C 42,24.5 42,6.5 21,6.5 C 15,6.5 11,9 11,11.5"
    stroke="currentColor"
    stroke-width="2.5"
    stroke-linecap="round"
  />

  <!-- Main 'H' Edges -->
  <line x1="11" y1="11.5" x2="11" y2="37.5" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" />
  <line x1="31" y1="11.5" x2="31" y2="37.5" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" />
  <line x1="11" y1="24.5" x2="31" y2="24.5" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" />

  <!-- Graph Vertices / Nodes -->
  <!-- Attractor Input Node (Slightly larger receiver: r=3.75) -->
  <circle cx="11" cy="11.5" r="3.75" fill="currentColor" />
  <circle cx="11" cy="24.5" r="3.25" fill="currentColor" />
  <circle cx="11" cy="37.5" r="3.25" fill="currentColor" />
  <circle cx="31" cy="11.5" r="3.25" fill="currentColor" />
  <circle cx="31" cy="24.5" r="3.25" fill="currentColor" />
  <circle cx="31" cy="37.5" r="3.25" fill="currentColor" />
</svg>
