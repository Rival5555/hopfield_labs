  <!-- Right Wall Stem -->
  <line x1="36" y1="8" x2="36" y2="40" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" />

  <!-- Descending Asymmetric Contour 1 (Upper Saddle / Crossbar) -->
