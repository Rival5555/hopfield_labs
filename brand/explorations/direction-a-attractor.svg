<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%" fill="none">
  <!-- Direction A (Refined): The Attractor — Symmetric Network Convergence -->
  <!-- Outer Ring Polygon -->
  <polygon
    points="24,8 38,16 38,32 24,40 10,32 10,16"
    stroke="currentColor"
    stroke-width="2.25"
    stroke-linejoin="round"
  />

  <!-- High-Clarity Internal Convergence Vectors (Thinned & Spaced to Prevent 16px Blobbing) -->
  <line x1="10" y1="32" x2="24" y2="8" stroke="currentColor" stroke-width="1.5" />
  <line x1="38" y1="32" x2="24" y2="8" stroke="currentColor" stroke-width="1.5" />
  <line x1="10" y1="16" x2="38" y2="16" stroke="currentColor" stroke-width="1.5" />

  <!-- Outlined Unsettled Nodes (Clear Center Gap) -->
  <circle cx="10" cy="16" r="3.25" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="2" />
  <circle cx="38" cy="16" r="3.25" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="2" />
  <circle cx="38" cy="32" r="3.25" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="2" />
  <circle cx="24" cy="40" r="3.25" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="2" />
  <circle cx="10" cy="32" r="3.25" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="2" />

  <!-- Settled Attractor State (Solid Dominant Node) -->
  <circle cx="24" cy="8" r="4.5" fill="currentColor" />
</svg>
